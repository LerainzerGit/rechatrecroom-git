<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReChat Git</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">R</div>
          <div>
            <div class="brand-name">ReChat Git</div>
            <div class="brand-subtitle">Static Git interface for Pages</div>
          </div>
        </div>

        <div class="search-wrap">
          <label class="sr-only" for="repo-input">Repository</label>
          <input id="repo-input" type="text" value="LerainzerGit/rechatrecroom-git" />
          <button id="load-btn">Load</button>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar panel">
          <div class="panel-header">Project</div>
          <div id="repo-card" class="repo-card">
            <div class="repo-name loading">Loading…</div>
            <div class="repo-desc loading">Loading repo metadata…</div>
          </div>

          <div class="stats" id="stats"></div>
        </aside>

        <section class="main panel">
          <div class="panel-header row">
            <span>Repository browser</span>
            <span id="branch-pill" class="pill">main</span>
          </div>

          <div id="tree" class="tree"></div>
        </section>
      </main>

      <section class="panel panel-lower">
        <div class="panel-header row">
          <span>Recent commits</span>
          <a id="repo-link" href="#" target="_blank" rel="noreferrer">Open on GitHub</a>
        </div>
        <div id="commits" class="commits"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
